# 브랜치에 푸시하면 웹으로 빌드해서 GitHub Pages에 올려요.
# 팀원은 주소만 열면 되고, 로그인도 설치도 필요 없어요.
#   https://eoris1225.github.io/school-app/
#
# 처음 한 번만 저장소 설정에서 아래 두 가지를 해주세요.
#   1) Settings > General > Change visibility > Public
#   2) Settings > Pages > Source 를 "GitHub Actions" 로
name: 웹 미리보기 배포

on:
  push:
    branches: [main]
  # 다른 브랜치는 Actions 탭에서 "Run workflow"로 직접 올릴 수 있어요.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 마지막 것만 남겨요.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 웹으로 내보내기
        # 내보낸 뒤에 "홈 화면에 추가" 정보를 넣는 것까지 한 번에 해요.
        # (scripts/add-pwa-tags.mjs 가 왜 따로 필요한지는 그 파일에 적어뒀어요)
        run: npm run build:web

      - name: 새로고침해도 안 깨지게 준비
        # 한 장짜리 앱(SPA)이라 /meal 같은 주소로 새로고침하면 GitHub Pages가
        # 404.html을 주는데, 그 파일을 index.html과 같게 만들어 두면 앱이 알아서 길을 찾아요.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
